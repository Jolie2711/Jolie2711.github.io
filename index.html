<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心有灵犀 · 双人猜词</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #6366f1;
  --primary-dark: #4f46e5;
  --primary-light: #eef2ff;
  --bg1: #eef2ff;
  --bg2: #e0e7ff;
  --text: #1e293b;
  --muted: #64748b;
  --danger: #ef4444;
  --success: #16a34a;
  --border: #e2e8f0;
}
body {
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
  color: var(--text);
  padding: 20px;
}
.app { width: 100%; max-width: 460px; }
.screen { display: none; }
.screen.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.card {
  background: #fff;
  border-radius: 20px;
  padding: 32px 28px;
  box-shadow: 0 20px 50px rgba(79, 70, 229, 0.16);
  text-align: center;
}
.title {
  font-size: 36px; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(135deg, var(--primary), #a855f7);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; margin-bottom: 6px;
}
.subtitle { color: var(--muted); margin-bottom: 28px; }
.section-title { font-size: 20px; margin-bottom: 16px; }
.hint { color: var(--muted); font-size: 13px; margin-top: 14px; }
.btn {
  display: inline-block; border: none; cursor: pointer;
  font-size: 16px; font-weight: 600; padding: 12px 22px;
  border-radius: 12px; font-family: inherit;
  transition: transform 0.1s ease, background 0.2s ease, opacity 0.2s ease;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn-secondary { background: var(--primary-light); color: var(--primary-dark); }
.btn-secondary:hover { background: #e0e7ff; }
.btn-block { width: 100%; margin-top: 14px; }
.divider {
  display: flex; align-items: center; gap: 10px;
  color: var(--muted); font-size: 13px; margin: 20px 0 14px;
}
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.join-row { display: flex; gap: 10px; }
.join-row input { flex: 1; }
input {
  width: 100%; padding: 12px 14px; font-size: 16px;
  border: 1.5px solid var(--border); border-radius: 12px; outline: none;
  transition: border-color 0.2s ease; font-family: inherit; text-align: center;
}
input:focus { border-color: var(--primary); }
input:disabled { background: #f1f5f9; }
.error { color: var(--danger); font-size: 13px; margin-top: 12px; }
.status { color: var(--muted); font-size: 14px; margin-top: 16px; min-height: 20px; }
.hidden { display: none !important; }
.room-code {
  font-size: 52px; font-weight: 800; letter-spacing: 8px;
  color: var(--primary-dark); margin: 8px 0;
}
.players { display: flex; flex-direction: column; gap: 10px; margin: 20px 0 4px; }
.player {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; background: #f8fafc; border-radius: 12px;
  color: var(--muted); font-size: 15px;
}
.player.ready { color: var(--text); background: var(--primary-light); font-weight: 600; }
.player .dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; }
.player.ready .dot { background: var(--success); }
.game-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.round-label { font-size: 18px; font-weight: 700; }
.timer { font-size: 32px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
.timer.danger { color: var(--danger); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.result-banner { font-size: 22px; font-weight: 700; padding: 14px; border-radius: 12px; margin: 8px 0 20px; }
.result-banner.match { color: var(--success); background: #dcfce7; }
.result-banner.miss { color: var(--danger); background: #fee2e2; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.answer { background: #f8fafc; border-radius: 14px; padding: 18px 12px; }
.answer-label { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.answer-word { font-size: 22px; font-weight: 700; word-break: break-all; }
.history-box { margin-top: 20px; text-align: left; }
.history-title { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
.history-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
.history-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #f8fafc; font-size: 14px; flex-wrap: wrap; }
.history-round { font-weight: 700; color: var(--muted); flex-shrink: 0; }
.history-words { flex: 1; word-break: break-all; }
.history-tag { flex-shrink: 0; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
.history-item.hit .history-tag { color: var(--success); background: #dcfce7; }
.history-item.miss .history-tag { color: var(--danger); background: #fee2e2; }
.history-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 8px; }
.history-list.full { max-height: none; overflow: visible; }
.summary { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>
<div class="app">

  <section id="screen-home" class="screen active">
    <div class="card">
      <h1 class="title">心有灵犀</h1>
      <p class="subtitle">双人线上猜词游戏</p>
      <button id="btn-create" class="btn btn-primary btn-block">创建房间</button>
      <div class="divider"><span>或</span></div>
      <div class="join-row">
        <input id="input-code" type="text" maxlength="6" inputmode="numeric" placeholder="6 位房间号" />
        <button id="btn-join" class="btn btn-secondary">加入</button>
      </div>
      <p id="home-error" class="error hidden"></p>
      <p class="hint">创建房间后，把房间号分享给好友即可开始（需联网）</p>
    </div>
  </section>

  <section id="screen-waiting" class="screen">
    <div class="card">
      <h2 class="section-title">房间号</h2>
      <div id="room-code" class="room-code">------</div>
      <p class="hint">把房间号发给好友，等待对方加入</p>
      <div class="players">
        <div id="player-0" class="player"><span class="dot"></span><span class="name">玩家 1</span></div>
        <div id="player-1" class="player"><span class="dot"></span><span class="name">等待加入...</span></div>
      </div>
      <button id="btn-start" class="btn btn-primary btn-block hidden">开始游戏</button>
      <p id="waiting-error" class="error hidden"></p>
    </div>
  </section>

  <section id="screen-game" class="screen">
    <div class="card">
      <div class="game-top">
        <span id="round-label" class="round-label">第 1 轮</span>
        <span id="timer" class="timer">60</span>
      </div>
      <p class="hint">输入一个词语，提交后等待对方</p>
      <input id="input-word" type="text" placeholder="输入你的词语" maxlength="30" />
      <button id="btn-submit" class="btn btn-primary btn-block">提交</button>
      <p id="opponent-status" class="status">等待对方提交...</p>
      <div class="history-box">
        <div class="history-title">历史记录</div>
        <div id="history-game" class="history-list"></div>
      </div>
    </div>
  </section>

  <section id="screen-reveal" class="screen">
    <div class="card">
      <h2 id="reveal-round" class="section-title">第 1 轮</h2>
      <div id="result-banner" class="result-banner"></div>
      <p id="game-summary" class="summary hidden"></p>
      <div class="answers">
        <div class="answer">
          <div class="answer-label">你的答案</div>
          <div id="answer-mine" class="answer-word">——</div>
        </div>
        <div class="answer">
          <div class="answer-label">对方的答案</div>
          <div id="answer-theirs" class="answer-word">——</div>
        </div>
      </div>
      <div id="result-action">
        <button id="btn-confirm" class="btn btn-primary btn-block">确认，进入下一轮</button>
        <button id="btn-playagain" class="btn btn-primary btn-block hidden">再来一局</button>
      </div>
      <p id="confirm-status" class="status"></p>
      <div class="history-box">
        <div class="history-title">历史记录</div>
        <div id="history-reveal" class="history-list"></div>
      </div>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
  const ROUND_SECONDS = 60;

  const screens = {
    home: document.getElementById('screen-home'),
    waiting: document.getElementById('screen-waiting'),
    game: document.getElementById('screen-game'),
    reveal: document.getElementById('screen-reveal'),
  };

  const $ = (id) => document.getElementById(id);
  const btnCreate = $('btn-create');
  const btnJoin = $('btn-join');
  const inputCode = $('input-code');
  const homeError = $('home-error');
  const roomCodeEl = $('room-code');
  const btnStart = $('btn-start');
  const player0 = $('player-0');
  const player1 = $('player-1');
  const roundLabel = $('round-label');
  const timerEl = $('timer');
  const inputWord = $('input-word');
  const btnSubmit = $('btn-submit');
  const opponentStatus = $('opponent-status');
  const revealRoundEl = $('reveal-round');
  const resultBanner = $('result-banner');
  const answerMine = $('answer-mine');
  const answerTheirs = $('answer-theirs');
  const btnConfirm = $('btn-confirm');
  const btnPlayagain = $('btn-playagain');
  const confirmStatus = $('confirm-status');
  const historyGame = $('history-game');
  const historyReveal = $('history-reveal');
  const gameSummary = $('game-summary');

  function showScreen(name) {
    Object.values(screens).forEach((s) => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  let peer = null;
  let conn = null;
  let isHost = false;
  let myIndex = 0;
  let roomCode = '';

  let round = 1;
  let myAnswer = '';
  let peerAnswer = '';
  let mySubmitted = false;
  let peerSubmitted = false;
  let myConfirmed = false;
  let peerConfirmed = false;
  let gameState = 'waiting'; // waiting | playing | reveal | won

  let roundTimer = null;
  let countdownTimer = null;
  let history = [];

  function normalize(w) {
    if (typeof w !== 'string') return '';
    return w.trim().toLowerCase();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function pushHistory(r, match, w0, w1) {
    history.push({ round: r, match: match, words: [w0 || '', w1 || ''] });
  }

  function renderHistory() {
    const html = history.slice().reverse().map(function (h) {
      const mine = h.words[myIndex] || '未提交';
      const theirs = h.words[1 - myIndex] || '未提交';
      const cls = h.match ? 'hit' : 'miss';
      const tag = h.match ? '命中' : '未命中';
      return '<div class="history-item ' + cls + '">' +
        '<span class="history-round">第 ' + h.round + ' 轮</span>' +
        '<span class="history-words">你：' + escapeHtml(mine) + ' ｜ 对方：' + escapeHtml(theirs) + '</span>' +
        '<span class="history-tag">' + tag + '</span>' +
        '</div>';
    }).join('');
    const display = history.length ? html : '<div class="history-empty">暂无记录</div>';
    historyGame.innerHTML = display;
    historyReveal.innerHTML = display;
  }

  function send(obj) {
    if (conn && conn.open) {
      try { conn.send(obj); } catch (e) {}
    }
  }

  // ---------- 等待界面渲染 ----------
  function renderWaiting() {
    const connected = !!(conn && conn.open);
    for (let i = 0; i < 2; i++) {
      const el = i === 0 ? player0 : player1;
      const nameEl = el.querySelector('.name');
      const isMe = i === myIndex;
      const isPresent = connected || isMe;
      if (isPresent) {
        const who = isMe ? '你' : '对方';
        const hostTag = i === 0 ? ' · 房主' : '';
        nameEl.textContent = `玩家 ${i + 1}（${who}）${hostTag}`;
        el.classList.add('ready');
      } else {
        nameEl.textContent = i === 0 ? '玩家 1' : '等待加入...';
        el.classList.remove('ready');
      }
    }
    btnStart.classList.toggle('hidden', !(isHost && connected));
  }

  // ---------- 创建房间（房主） ----------
  function genCode() {
    return String(Math.floor(100000 + Math.random() * 900000));
  }

  btnCreate.addEventListener('click', () => {
    homeError.classList.add('hidden');
    createRoom();
  });

  function createRoom() {
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    conn = null;
    isHost = true;
    myIndex = 0;
    const code = genCode();
    roomCode = code;
    peer = new Peer(code, { debug: 0 });

    peer.on('open', () => {
      roomCodeEl.textContent = code;
      showScreen('waiting');
      renderWaiting();
    });

    peer.on('connection', (c) => {
      conn = c;
      setupConn();
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        try { peer.destroy(); } catch (e) {}
        peer = null;
        createRoom();
      } else {
        homeError.textContent = '创建房间失败：' + (err.type || '未知错误');
        homeError.classList.remove('hidden');
      }
    });
  }

  // ---------- 加入房间（好友） ----------
  btnJoin.addEventListener('click', joinRoom);
  inputCode.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom(); });

  function joinRoom() {
    const code = inputCode.value.trim();
    if (!/^\d{6}$/.test(code)) {
      homeError.textContent = '请输入 6 位数字房间号';
      homeError.classList.remove('hidden');
      return;
    }
    homeError.classList.add('hidden');
    if (peer) { try { peer.destroy(); } catch (e) {} }
    conn = null;
    isHost = false;
    myIndex = 1;
    roomCode = code;

    peer = new Peer({ debug: 0 });
    peer.on('open', () => {
      conn = peer.connect(code, { reliable: true });
      setupConn();
    });
    peer.on('error', (err) => {
      if (err.type === 'peer-unavailable') {
        homeError.textContent = '房间不存在，请检查房间号';
      } else {
        homeError.textContent = '连接失败：' + (err.type || '未知错误');
      }
      homeError.classList.remove('hidden');
    });
  }

  // ---------- 连接事件 ----------
  function setupConn() {
    conn.on('open', onConnOpen);
    conn.on('data', (msg) => handleMessage(msg));
    conn.on('close', onConnClose);
    conn.on('error', () => onConnClose());
  }

  function onConnOpen() {
    if (isHost) {
      renderWaiting();
    } else {
      roomCodeEl.textContent = roomCode;
      renderWaiting();
      showScreen('waiting');
    }
  }

  function onConnClose() {
    clearTimeout(roundTimer);
    clearInterval(countdownTimer);
    conn = null;
    if (isHost) {
      renderWaiting();
      showScreen('waiting');
    } else {
      homeError.textContent = '对方已离开房间';
      homeError.classList.remove('hidden');
      showScreen('home');
    }
  }

  // ---------- 房主开始新一轮 ----------
  btnStart.addEventListener('click', () => {
    if (!isHost || !(conn && conn.open)) return;
    beginRound(1);
  });

  function beginRound(n) {
    round = n;
    myAnswer = '';
    peerAnswer = '';
    mySubmitted = false;
    peerSubmitted = false;
    myConfirmed = false;
    peerConfirmed = false;
    const deadline = Date.now() + ROUND_SECONDS * 1000;
    startRoundLocal(n, deadline);
    send({ type: 'roundStart', round: n, deadline });
    clearTimeout(roundTimer);
    roundTimer = setTimeout(() => {
      if (gameState === 'playing') hostReveal();
    }, ROUND_SECONDS * 1000);
  }

  function startRoundLocal(n, deadline) {
    gameState = 'playing';
    mySubmitted = false;
    myConfirmed = false;
    inputWord.disabled = false;
    inputWord.value = '';
    btnSubmit.disabled = false;
    btnConfirm.disabled = false;
    roundLabel.textContent = `第 ${n} 轮`;
    revealRoundEl.textContent = `第 ${n} 轮`;
    opponentStatus.textContent = '等待对方提交...';
    startCountdown(deadline);
    if (n === 1) history = [];
    renderHistory();
    showScreen('game');
    inputWord.focus();
  }

  function startCountdown(deadline) {
    clearInterval(countdownTimer);
    function update() {
      const remain = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      timerEl.textContent = remain;
      timerEl.classList.toggle('danger', remain <= 10);
      if (remain <= 0) clearInterval(countdownTimer);
    }
    update();
    countdownTimer = setInterval(update, 250);
  }

  // ---------- 提交 ----------
  btnSubmit.addEventListener('click', submitWord);
  inputWord.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitWord(); });

  function submitWord() {
    if (mySubmitted || gameState !== 'playing') return;
    const word = inputWord.value.trim();
    if (!word) return;
    mySubmitted = true;
    myAnswer = word;
    inputWord.disabled = true;
    btnSubmit.disabled = true;
    opponentStatus.textContent = '已提交，等待对方...';
    if (isHost) {
      send({ type: 'peerSubmitted' });
      if (peerSubmitted) hostReveal();
    } else {
      send({ type: 'submit', word });
    }
  }

  function hostReveal() {
    clearTimeout(roundTimer);
    const w0 = myAnswer;
    const w1 = peerAnswer;
    const match = normalize(w0) !== '' && normalize(w0) === normalize(w1);
    const answers = [
      { index: 0, word: w0 || null },
      { index: 1, word: w1 || null },
    ];
    showRevealLocal(match, round, answers);
    send({ type: 'roundResult', match, round, answers });
  }

  function showRevealLocal(match, r, answers) {
    clearInterval(countdownTimer);
    gameState = match ? 'won' : 'reveal';
    revealRoundEl.textContent = `第 ${r} 轮`;
    const mine = answers.find((a) => a.index === myIndex);
    const theirs = answers.find((a) => a.index !== myIndex);
    answerMine.textContent = mine && mine.word ? mine.word : '未提交';
    answerTheirs.textContent = theirs && theirs.word ? theirs.word : '未提交';
    const w0 = (answers.find((a) => a.index === 0) || {}).word || '';
    const w1 = (answers.find((a) => a.index === 1) || {}).word || '';
    pushHistory(r, match, w0, w1);
    renderHistory();
    if (match) {
      resultBanner.textContent = '猜中了！你们真有默契';
      resultBanner.className = 'result-banner match';
      btnConfirm.classList.add('hidden');
      btnPlayagain.classList.remove('hidden');
      confirmStatus.textContent = '';
      historyReveal.classList.add('full');
      gameSummary.textContent = '共用 ' + r + ' 轮猜中';
      gameSummary.classList.remove('hidden');
    } else {
      resultBanner.textContent = '还没猜中，继续加油';
      resultBanner.className = 'result-banner miss';
      btnConfirm.classList.remove('hidden');
      btnPlayagain.classList.add('hidden');
      myConfirmed = false;
      btnConfirm.disabled = false;
      confirmStatus.textContent = '';
      historyReveal.classList.remove('full');
      gameSummary.classList.add('hidden');
    }
    showScreen('reveal');
  }

  // ---------- 确认进入下一轮 ----------
  btnConfirm.addEventListener('click', () => {
    if (myConfirmed || gameState !== 'reveal') return;
    myConfirmed = true;
    btnConfirm.disabled = true;
    confirmStatus.textContent = '已确认，等待对方...';
    if (isHost) {
      send({ type: 'peerConfirmed' });
      if (peerConfirmed) beginRound(round + 1);
    } else {
      send({ type: 'confirm' });
    }
  });

  // ---------- 再来一局 ----------
  btnPlayagain.addEventListener('click', () => {
    if (gameState !== 'won') return;
    if (isHost) {
      beginRound(1);
    } else {
      send({ type: 'playAgain' });
    }
  });

  // ---------- 消息处理 ----------
  function handleMessage(msg) {
    if (!msg || !msg.type) return;
    switch (msg.type) {
      case 'roundStart':
        startRoundLocal(msg.round, msg.deadline);
        break;
      case 'peerSubmitted':
        opponentStatus.textContent = '对方已提交';
        break;
      case 'peerConfirmed':
        confirmStatus.textContent = '对方已确认，等待你确认...';
        break;
      case 'roundResult':
        showRevealLocal(msg.match, msg.round, msg.answers);
        break;
      case 'submit': {
        if (!peerSubmitted) {
          peerAnswer = msg.word;
          peerSubmitted = true;
        }
        if (!mySubmitted) opponentStatus.textContent = '对方已提交';
        if (mySubmitted) hostReveal();
        break;
      }
      case 'confirm': {
        if (!peerConfirmed) peerConfirmed = true;
        confirmStatus.textContent = '对方已确认，等待你确认...';
        if (myConfirmed) beginRound(round + 1);
        break;
      }
      case 'playAgain':
        beginRound(1);
        break;
    }
  }
})();
</script>
</body>
</html>
